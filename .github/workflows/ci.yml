name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: python -m pip install -U pip && python -m pip install '.[test,notifications]'
      - name: Test
        run: pytest
      - name: Beets plugin smoke test
        shell: bash
        run: |
          tmpdir="$(mktemp -d)"
          mkdir -p \
            "$tmpdir/library" \
            "$tmpdir/incoming" \
            "$tmpdir/staging" \
            "$tmpdir/manual" \
            "$tmpdir/duplicates" \
            "$tmpdir/failed"
          cat > "$tmpdir/config.yaml" <<EOF
          library: $tmpdir/library.db
          directory: $tmpdir/library
          plugins: smartimport
          smartimport:
            incoming: $tmpdir/incoming
            staging: $tmpdir/staging
            manual: $tmpdir/manual
            duplicates: $tmpdir/duplicates
            failed: $tmpdir/failed
            sync_artwork: false
            sync_animated_artwork: false
            notifications:
              enabled: false
          EOF
          beet -c "$tmpdir/config.yaml" version | tee "$tmpdir/version.txt"
          grep -qi "smartimport" "$tmpdir/version.txt"
          beet -c "$tmpdir/config.yaml" smartimport --dry-run

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Build
        run: python -m pip install -U build && python -m build
