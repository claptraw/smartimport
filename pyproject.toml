[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "beets-smartimport"
version = "1.1.0"
description = "Conservative Beets plugin for attaching new tracks to existing albums and staging unknown releases."
readme = "README.md"
requires-python = ">=3.10,<3.15"
license = "MIT"
authors = [
  { name = "claptraw" }
]
keywords = ["beets", "music", "metadata", "musicbrainz", "import"]
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Environment :: Console",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Multimedia :: Sound/Audio",
]
dependencies = [
  "beets>=2.13.1,<3",
  "musicbrainzngs>=0.7.1",
]

[project.optional-dependencies]
notifications = ["apprise>=1.9"]
test = [
  "pytest>=8",
  "build>=1.2",
  "apprise>=1.9",
]

[project.urls]
Homepage = "https://github.com/claptraw/smartimport"
Repository = "https://github.com/claptraw/smartimport"
Issues = "https://github.com/claptraw/smartimport/issues"

[tool.setuptools.packages.find]
where = ["."]
include = ["beetsplug*"]
namespaces = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
